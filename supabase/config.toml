# Supabase CLI config for LOCAL development (`npx supabase start`).
# This drives the local Docker stack (Postgres + Auth + Studio) that stands in
# for a cloud project during development. The only CLOUD Supabase project is
# `overload-prod` (production); there is no dev cloud project.
#
# If your installed CLI needs a different `[db].major_version` image than below,
# change it to match (or run `npx supabase init` to regenerate a full config and
# re-apply the auth settings here).

project_id = "overload"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Auth mirrors production: Supabase's own public signups are OFF, always.
# Accounts (Pitch 9) creates invite-gated accounts on the server with the
# admin API, so the anon key can never create one. (A local user can still be
# added by hand in Studio, http://127.0.0.1:54323 → Authentication → Add user.)
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# NOTE: despite its name, this key enables the EMAIL PROVIDER itself (it maps to
# GoTrue's "external email enabled"). Setting it false disables email/password
# LOGIN entirely ("Email logins are disabled"). Public sign-ups stay off via
# `[auth] enable_signup = false` above.
enable_signup = true
enable_confirmations = false
# Accounts (review fix): the auth service itself refuses a password change
# from a session that didn't sign in recently, so a stolen or unattended
# auth session can't change the password by calling Supabase directly. The
# app has no password change of its own (password reset was removed: it needs
# an email provider, and Overload sends no email).
secure_password_change = true

# ------------------------------------------------------------------------------
# Public Accounts (PA3 / spec §11, R3) — custom SMTP for auth email (Resend).
#
# Recovery and verification route through Supabase Auth's OWN templates over a
# custom SMTP provider (Resend). No `resend` SDK is added; the app sends no mail
# of its own. `enable_confirmations` stays FALSE above (turning it on would gate
# sign-in); verification is a separate, non-blocking flow (`Profile.emailVerifiedAt`).
#
# LOCAL DEV: leave the [auth.email.smtp] block below COMMENTED OUT. With no SMTP
# configured, the Supabase CLI stack routes all auth mail to its built-in mail
# catcher (Inbucket / Mailpit, Studio → http://127.0.0.1:54324), so recovery and
# verification links are inspectable locally without any real provider. Only
# uncomment and fill the env(...) values to exercise a real SMTP send locally.
#
# PRODUCTION & RUNBOOK (owner steps — NOT configured here): a verified sending
# DOMAIN in Resend with DNS records (SPF, DKIM, DMARC); the real SMTP host, port,
# and credentials; and the two real SENDER IDENTITIES. Production SMTP is set in
# the Supabase project dashboard (Auth → SMTP Settings), not in this file. NO
# real domains or credentials are invented here — see the Public Accounts runbook.
#
# Two separate sender identities (spec §11, design Screens 4 & 6):
#   • authentication — no-reply@<auth domain placeholder>  (recovery/verify mail)
#   • support        — support@<support domain placeholder> (the /support mailto:
#                      target; NOT a sending integration — surfaced via the app's
#                      OVERLOAD_SUPPORT_EMAIL env var, not here).
#
# [auth.email.smtp]
# enabled = true
# host = "env(SMTP_HOST)"          # e.g. smtp.resend.com
# port = 587
# user = "env(SMTP_USER)"          # Resend: the literal "resend"
# pass = "env(SMTP_PASS)"          # Resend API key — SERVER-ONLY, never committed
# admin_email = "env(SMTP_SENDER)" # authentication identity, e.g. no-reply@<auth domain>
# sender_name = "Overload"

# Library & Gyms Setup: the exercise-image bucket. PUBLIC-READ (imported,
# public-domain free-exercise-db images only). Written ONLY by the catalog
# import (`npm run db:seed`) with the service-role key; there is no storage
# policy for anon/authenticated, so the browser can never upload.
[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.exercise-images]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/jpeg"]
