<!doctype html>
<!--
  Overload password-reset email (Accounts spec R7, design doc Screen 4).
  Configured locally in supabase/config.toml; in production paste this body
  into overload-prod → Authentication → Emails → Reset Password (runbook).
  The link goes to Overload's /auth/confirm, which verifies the one-time
  token_hash on the server (works on any device). One link, no images, no
  tracking, no other links.
-->
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f7f7f8;
      color: #0e0e10;
      font-family:
        Inter,
        -apple-system,
        &quot;Segoe UI&quot;,
        Roboto,
        sans-serif;
      font-size: 14px;
      line-height: 22px;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto"
    >
      <tr>
        <td
          style="
            background: #ffffff;
            border: 1px solid #e4e4e8;
            border-radius: 8px;
            padding: 24px;
          "
        >
          <p style="margin: 0 0 16px; font-size: 18px; font-weight: 600">
            Overload
          </p>
          <p style="margin: 0 0 16px">
            Someone asked to reset the password for your Overload account.
          </p>
          <p style="margin: 0 0 16px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
              style="
                display: inline-block;
                background: #0159fd;
                color: #ffffff;
                text-decoration: none;
                font-weight: 500;
                padding: 12px 16px;
                border-radius: 6px;
              "
              >Set a new password</a
            >
          </p>
          <p style="margin: 0; color: #5f5f68">
            This link works once and expires in 1 hour. If you didn't ask for
            this, ignore this email — your password won't change.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
